</style></head><body><header><b>◒　한화오션 사업계획</b><span>FY 2026　·　관리회계 워크스페이스</span></header><div class="shell"><nav id="nav"></nav><div class="main"><div class="row"><div><small id="context"></small><h1 id="title"></h1></div><span class="tag">내부계획 예시 · 억 원</span></div><div id="filters"></div><div id="notice" role="status"></div><main id="body"></main></div></div>
<dialog id="editor"><form id="form"><div id="fields"></div><p class="error" id="err" role="alert"></p><div class="actions"><button class="primary">저장</button><button type="button" id="cancel">취소</button></div></form></dialog><script>
'use strict';
const $=id=>document.getElementById(id), fmt=n=>n.toLocaleString('ko-KR',{maximumFractionDigits:1}), esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x)), sum=(rows,k)=>rows.reduce((s,r)=>s+r[k],0);
const firms=['한화오션','한화오션에코텍','한화해양공정(산동)'], segments=['상선','해양 및 특수선','E&I','기타'];
const tabs=['계획 총괄','프로젝트 계획','손익 분석','목표·배부 설정','시나리오 비교','기준계획 버전','공시 실적 분석','월별 계획 취합','법인 제출·검토','기준계획 차이'];
const metrics={sales:'매출',mat:'재료비',labor:'노무비',sub:'외주비',other:'기타 제조원가',cost:'매출원가',gp:'매출총이익',sg:'배부 판관비',op:'영업이익'};
const costKeys=['mat','labor','sub','other'];
function seedProject(id,name,firm,seg,contract,opening,q,cost,internal=false){
 return {id,name,firm,seg,contract,opening,q,cost,internal};
}
const seed={projects:[
 seedProject(1,'LNG 운반선 시리즈 A',0,0,95000,12,[15,18,17,18],[43700,12500,17800,4600]),
 seedProject(2,'대형 유조선 시리즈 B',0,0,59000,10,[13,17,20,19],[26300,8100,11000,3350]),
 seedProject(3,'특수선 건조 패키지',0,1,32500,15,[13,14,15,16],[14900,6500,6800,1950]),
 seedProject(4,'에너지 플랜트 EPC',0,2,14200,18,[12,13,15,16],[6400,2200,3600,950]),
 seedProject(5,'선박 정비 패키지',0,3,2300,10,[14,16,18,18],[850,390,470,200]),
 seedProject(6,'선박 블록 공급',1,0,6800,15,[16,19,20,18],[3200,1300,1050,510],true),
 seedProject(7,'선체 가공 물량',2,0,4300,20,[15,18,16,19],[1900,890,650,380],true)
],pool:6800,basis:'sales',salesTarget:135000,profitTarget:12500};
const key='ocean-planning-workbook-v1';let db={plan:clone(seed),versions:[]},loadError='',stored=null;
try{const raw=localStorage.getItem(key);stored=raw;if(raw){const parsed=JSON.parse(raw);if(Array.isArray(parsed.plan?.projects)&&Array.isArray(parsed.versions))db=parsed;else throw Error()}}catch{loadError='저장된 계획을 읽을 수 없어 예시 계획을 표시합니다.'}
let tab=0,firm='all',seg='all',period='all',group='firm',viewVersion='live',draft=null;
const scenario={firm:'all',sales:0,mat:0,labor:0,sub:0,sg:0};
const plan=()=>viewVersion==='live'?db.plan:db.versions.find(v=>v.id===viewVersion).plan;
function save(next){
 try{
   if(localStorage.getItem(key)!==stored){
     $('notice').textContent='다른 탭에서 계획이 바뀌었습니다. 이 탭을 새로고침한 후 다시 저장하세요.';
     if($('editor').open)$('err').textContent=$('notice').textContent;
     return false;
   }
   const raw=JSON.stringify(next);
   localStorage.setItem(key,raw);
   stored=raw;
   db=next;
   return true;
 }catch{$('notice').textContent='브라우저 저장에 실패했습니다. 저장 공간과 권한을 확인하세요.';return false}
}
function totals(rows){return Object.fromEntries(Object.keys(metrics).map(k=>[k,sum(rows,k)]))}
const months=Array.from({length:12},(_,i)=>i);
const entryKeys=['sales',...costKeys];
function monthlyEntry(project,month){
 const entered=project.monthly?.[month];
 if(entered) return entered;
 const progress=project.q[Math.floor(month/3)]/300;
 return [project.contract,...project.cost].map(n=>n*progress);
}
function ledger(p,assume={}){
 const rows=p.projects.flatMap(project=>months.map(m=>{
   const scoped=assume.firm==='all'||String(project.firm)===assume.firm;
   const entry=monthlyEntry(project,m);
   const r={id:project.id,firm:project.firm,seg:project.seg,name:project.name,internal:project.internal,m,q:Math.floor(m/3)};
   entryKeys.forEach((k,i)=>r[k]=entry[i]*(1+(scoped?(assume[k]||0):0)/100));
   r.cost=costKeys.reduce((s,k)=>s+r[k],0);
   r.gp=r.sales-r.cost;
   return r;
 }));
 const monthlyPool=p.pool*(1+(assume.sg||0)/100)/12;
 for(const month of months){
   const active=rows.filter(r=>r.m===month);
   const weights=active.map(r=>p.basis==='equal'?1:r[p.basis]);
   const total=weights.reduce((a,b)=>a+b,0);
   active.forEach((r,i)=>{r.sg=monthlyPool*(total?weights[i]/total:1/active.length);r.op=r.gp-r.sg});
 }
 return rows;
}
function scope(rows){
 return rows.filter(r=>(firm==='all'||String(r.firm)===firm)&&
   (seg==='all'||String(r.seg)===seg)&&
   (period==='all'||period==='m'+r.m||period===String(r.q)));
}
function elimination(rows){
 const t=totals([]),v=sum(rows.filter(r=>r.internal),'sales');
 t.sales=-v;t.cost=-v;t.sub=-v;return t;
}
function report(rows){const t=totals(rows);if(firm==='all'){const e=elimination(rows);for(const k in t)t[k]+=e[k]}return t}
function select(id,items,value){return '<select id="'+id+'">'+items.map(([v,n])=>'<option value="'+esc(v)+'" '+(String(v)===String(value)?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select>'}
const options=a=>a.map((x,i)=>[i,x]),all=(name,a)=>[['all',name],...options(a)];
function table(headers,rows,foot=[]){const tr=r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>';return '<div class="wrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(tr).join('')+'</tbody><tfoot>'+foot.map(tr).join('')+'</tfoot></table></div>'}
function cards(entries){return '<div class="grid">'+entries.map(([n,v,sub])=>'<div class="card"><small>'+n+'</small><b>'+v+'</b><em>'+sub+'</em></div>').join('')+'</div>'}
function act(action,label,arg=''){return '<button data-act="'+action+'" data-arg="'+esc(arg)+'">'+label+'</button>'}
function panel(title,content){return '<article><h2>'+title+'</h2>'+content+'</article>'}
function render(){const p=plan(),r=scope(ledger(p)),t=report(r);$('nav').innerHTML='<small>사업계획 업무</small>'+tabs.map((n,i)=>'<button data-tab="'+i+'" class="'+(i===tab?'active':'')+'">'+n+'</button>').join('');
 $('title').textContent=tabs[tab];$('context').textContent=tab===6?'2025년 공시 실적 기반 시뮬레이터':viewVersion==='live'?'2026년 작업계획 · 브라우저 저장':'저장 기준계획 · 읽기 전용';
 const scoped=[0,1,2,4,7,9].includes(tab);
 $('filters').innerHTML=tab===6?'':'<div class="filters">'+(![5,8].includes(tab)?'<label>계획 '+select('version',[['live','작업계획'],...db.versions.map(v=>[v.id,v.name])],viewVersion)+'</label>':'')+(scoped?'<label>법인 '+select('firm',all('전체 · 연결',firms),firm)+'</label><label>사업 '+select('seg',all('전체 사업',segments),seg)+'</label><label>기간 '+select('period',[...all('연간',['1분기','2분기','3분기','4분기']),...months.map(m=>['m'+m,(m+1)+'월'])],period)+'</label>'+([7,9].includes(tab)?'':act('csv','손익 CSV')):'')+'</div>';
 const sections=[overview,projects,analysis,settings,simulate,versions,disclosure,monthlyPage,reviewPage,variancePage];
 $('body').innerHTML=sections[tab](p,r,t);
 if(tab===6)$('disclosed').srcdoc=JSON.parse($('legacy').textContent);
 for(const [id,set] of [['firm',v=>firm=v],['seg',v=>seg=v],['period',v=>period=v],['version',v=>viewVersion=v],['group',v=>group=v]]){
 if($(id))$(id).onchange=e=>{set(e.target.value);render()}}
 if(tab===4)bindSimulation();
 if(tab===7&&$('upload'))$('upload').onchange=readUpload;
 if(tab===9&&$('compare'))$('compare').onchange=e=>{compareId=e.target.value;render()};
 if(tab===7&&$('find'))$('find').oninput=e=>{
   keyword=e.target.value;
   $('monthly-list').innerHTML=monthlyTable(p,r);
 };
}
function overview(p,r,t){
 const global=reportFull(p), isAnnual=period==='all'&&firm==='all'&&seg==='all';
 const list=[['매출',fmt(t.sales),isAnnual?'목표 차이 '+fmt(t.sales-p.salesTarget):'선택 범위 합계'],['매출원가',fmt(t.cost),'재료·노무·외주·기타'],['영업이익',fmt(t.op),isAnnual?'목표 차이 '+fmt(t.op-p.profitTarget):'판관비 배부 후'],['영업이익률',t.sales?(100*t.op/t.sales).toFixed(1)+'%':'—','계획 영업이익 ÷ 매출']];
 const byMonth=months.map(m=>({m,posted:r.filter(x=>x.m===m)})).filter(x=>x.posted.length);
 const monthTotals=byMonth.map(({m,posted})=>[m,report(posted)]);
 const peak=Math.max(1,...monthTotals.map(([,v])=>v.sales));
 const bars='<div class="timeline" role="img" aria-label="월별 계획 매출">'+monthTotals.map(([m,v])=>'<i title="'+(m+1)+'월 · '+fmt(v.sales)+'억 원" style="height:'+Math.max(1,100*v.sales/peak)+'%"></i>').join('')+'</div>';
 const reviewSummary=firms.map((n,i)=>[n,reviewLabel(reviewState(db.plan,i).state),act('goto','제출 현황',8)]);
 const workflow='<div class="work-nav padded">'+act('goto','월별 계획 취합',7)+act('goto','법인 제출·검토',8)+act('goto','기준계획 차이',9)+'</div>';
 return cards(list)+panel('이번 계획 작업',workflow+table(['법인','제출 상태','확인'],reviewSummary))+
 panel('월별 연결 계획',bars+table(['기간','매출','매출원가','판관비','영업이익'],monthTotals.map(([m,v])=>[(m+1)+'월',fmt(v.sales),fmt(v.cost),fmt(v.sg),fmt(v.op)])))+
 panel('전사 연간 목표',table(['지표','목표','선택 버전 계획','차이'],[['연결 매출',fmt(p.salesTarget),fmt(global.sales),fmt(global.sales-p.salesTarget)],['영업이익',fmt(p.profitTarget),fmt(global.op),fmt(global.op-p.profitTarget)]]));
}
function reportFull(p){const rows=ledger(p),t=totals(rows),e=elimination(rows);for(const k in t)t[k]+=e[k];return t}
function projects(p,r){const ids=[...new Set(r.map(x=>x.id))];return panel('프로젝트 원장','<div class="row"><p class="hint">프로젝트명을 선택하면 계약·공정·원가 산출 근거를 확인할 수 있습니다.</p>'+(viewVersion==='live'?act('new','＋ 프로젝트 등록'):'')+'</div>'+table(['프로젝트','법인','사업','거래','계약액','기간 매출','기간 원가','영업이익'],ids.map(id=>{const a=p.projects.find(x=>x.id===id),t=totals(r.filter(x=>x.id===id));return [act('edit',esc(a.name),id),firms[a.firm],segments[a.seg],a.internal?'내부':'외부',fmt(a.contract),fmt(t.sales),fmt(t.cost),fmt(t.op)]})))}
function analysis(p,r,t){
 const dims={firm:'법인',seg:'사업',project:'프로젝트'};
 const names=new Map();for(const x of r){const n=group==='firm'?firms[x.firm]:group==='seg'?segments[x.seg]:x.name;const key=group==='project'?x.id:n;if(!names.has(key))names.set(key,{n,items:[]});names.get(key).items.push(x)}
 const keys=Object.keys(metrics);const row=(n,t)=>[n,...keys.map(k=>fmt(t[k]))];
 return panel('관리 손익 명세','<div class="filters"><label>집계 단위 '+select('group',Object.entries(dims),group)+'</label></div>'+table(['구분',...Object.values(metrics)],[...Array.from(names.values(),b=>row(esc(b.n),totals(b.items))),...(firm==='all'?[row('내부거래 제거',elimination(r))]:[])],[row('합계',t)])+'<p class="hint">전체 법인 조회 시 내부 공급 매출과 대응 외주비를 같은 금액으로 제거합니다. 사업별 조회에서는 공급 사업에 제거액을 귀속합니다.</p>')}
function settings(p){return panel('연간 목표 및 공통비',table(['항목','설정값'],[['목표 연결 매출',fmt(p.salesTarget)],['목표 영업이익',fmt(p.profitTarget)],['연간 판관비',fmt(p.pool)],['프로젝트 배부 기준',({sales:'매출 비례',labor:'노무비 비례',equal:'균등'})[p.basis]]])+(viewVersion==='live'?act('settings','목표·배부 수정'):'')+'<p class="hint">판관비는 월별 1/12로 편성하고 전체 프로젝트에 배부합니다. 선택 기준의 월 합계가 0이면 균등 배부합니다.</p>')+panel('관리 기준정보',table(['법인','관리 프로젝트 수'],firms.map((f,i)=>[f,p.projects.filter(x=>x.firm===i).length]))+'<p class="hint">법인명은 사업보고서에 등장하는 회사입니다. 법인별 계약·프로젝트·원가·내부거래·목표는 업무 체험용 가정입니다. 거래 제거는 내부 공급 전액이 같은 기간 구매 법인의 외주비로 소비된다는 단순 모형입니다.</p>')}
function field(label,k,value,min=0,max=1e8){return '<label>'+label+'<input type="number" required name="'+k+'" min="'+min+'" max="'+max+'" step="any" value="'+value+'"></label>'}
function simResults(){
 const baseRows=scope(ledger(plan())),altRows=scope(ledger(plan(),scenario));
 const base=report(baseRows),alt=report(altRows);
 const bridges=firms.map((name,i)=>{
   const b=totals(baseRows.filter(r=>r.firm===i)),a=totals(altRows.filter(r=>r.firm===i));
   return [name,fmt(a.sales-b.sales),fmt(a.cost-b.cost),fmt(a.sg-b.sg),fmt(a.op-b.op)];
 }).filter((row,i)=>baseRows.some(r=>r.firm===i));
 if(firm==='all'){const b=elimination(baseRows),a=elimination(altRows);bridges.push(['연결조정',fmt(a.sales-b.sales),fmt(a.cost-b.cost),'0','0'])}

function parseCsv(text){
 const rows=[];
 let row=[],field='',quoted=false,closed=false;
 text=text.replace(/^\uFEFF/,'');
 for(let i=0;i<text.length;i++){
   const c=text[i];
   if(quoted){
     if(c==='"'&&text[i+1]==='"'){field+='"';i++}
     else if(c==='"'){quoted=false;closed=true}
     else field+=c;
     continue;
   }
   if(c===','||c==='\n'||c==='\r'){
     row.push(field);field='';closed=false;
     if(c!==','){rows.push(row);row=[];if(c==='\r'&&text[i+1]==='\n')i++}
   }else if(c==='"'&&!field&&!closed){quoted=true}
   else if(c==='"'||closed){throw Error('CSV 따옴표 형식을 확인하세요.')}
   else field+=c;
 }
 if(quoted)throw Error('닫히지 않은 CSV 따옴표가 있습니다.');
 if(field||row.length||closed)rows.push([...row,field]);
 return rows;
}
function validateUpload(text,p){

 lines.forEach((cells,i)=>{
   if(cells.every(x=>!x.trim()))return;
   const id=Number(cells[0]),m=Number(cells[1])-1,project=projects.get(id),key=id+':'+m;
   const amounts=cells.slice(2,7);
   const badAmount=amounts.length!==5||amounts.some(x=>!/^\d+(\.\d+)?$/.test(x.trim())||Number(x)>1e8);
   let reason='';
   if(!project)reason='등록된 프로젝트 ID를 입력하세요.';
   else if(!Number.isInteger(m)||m<0||m>11)reason='월은 1~12 사이의 정수여야 합니다.';
   else if(used.has(key))reason='같은 프로젝트와 월이 두 번 입력됐습니다.';
   else if(!canEdit(p,project.firm))reason='제출 또는 승인 상태의 법인은 수정할 수 없습니다.';
   else if(badAmount)reason='금액 5개에 0 이상 숫자를 입력하세요. 천 단위 구분 기호는 제외합니다.';

}

   return '<section><span class="tag '+(state.state==='returned'?'warn':state.state==='approved'?'badge-approved':'')+'">'+reviewLabel(state.state)+'</span><b>'+name+'</b><small>연간 매출 '+fmt(total.sales)+'억 원 · 영업이익 '+fmt(total.op)+'억 원</small>'+
     (state.note?'<p class="hint">'+esc(state.note)+'</p>':'')+
     (issues.length?'<p class="error">'+esc(issues[0])+'</p>':'')+'<div>'+next+'</div></section>';
 }).join('');
 const history=(db.events||[]).slice(0,30).map(e=>[esc(new Date(e.date).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})),firms[e.firm],reviewLabel(e.state),esc(e.note)]);
 const allApproved=firms.every((_,i)=>reviewState(live,i).state==='approved');
 return panel('법인별 제출 현황','<p class="hint">제출 후 해당 법인의 프로젝트와 월별 입력을 잠급니다. 반려 사유를 남기면 수정과 재제출이 가능합니다. 이 브라우저에서 담당자·검토자 흐름을 체험할 수 있습니다.</p><div class="review">'+states+'</div><div class="actions">'+
   (allApproved?act('approved-baseline','승인본을 기준계획으로 확정'):'<small>모든 법인이 승인되면 승인 기준계획을 저장할 수 있습니다.</small>')+'</div>')+
   panel('제출·검토 이력',history.length?table(['시각 · KST','법인','동작','메모'],history):'<p class="hint">아직 기록된 제출·검토 이력이 없습니다.</p>');
}
function startReview(arg){
 const [state,i]=arg.split(':'),index=Number(i);
 if(state==='submitted'){
   const issues=reviewIssues(db.plan,index);
   if(issues.length){$('notice').textContent=issues.join(' ');return}
 }
 draft={kind:'review',state,index};
 const required=state==='returned'?' required':'';
 $('fields').innerHTML='<h2>'+firms[index]+' · '+reviewLabel(state)+'</h2><p class="hint">'+(state==='returned'?'수정 요청 사유를 남기면 계획이 다시 열립니다.':'현재 프로젝트 및 월별 입력을 기준으로 상태를 변경합니다.')+'</p><label>검토 메모 <input class="formwide" name="note" maxlength="240"'+required+'></label>';
 prepareDialog();
}
function variancePage(p,r,t){
 const choices=db.versions.filter(v=>v.id!==viewVersion);
 if(!choices.length)return panel('기준계획 선택','<p class="hint">비교할 계획이 없습니다. 기준계획이나 대안 버전을 먼저 저장하세요.</p>'+act('goto','기준계획 버전 열기',5));
 const base=choices.find(v=>v.id===compareId)||choices.find(v=>v.category==='approved')||choices[0];
 const prev=scope(ledger(base.plan)),b=report(prev);
 const metricsForBridge=['sales',...costKeys,'sg','op'];
 const diff=(a,b,k)=>a[k]-b[k];
 const deltas=metricsForBridge.map(k=>[metrics[k],fmt(b[k]),fmt(t[k]),fmt(diff(t,b,k)),fmt(diff(t,b,k)*(k==='sales'||k==='op'?1:-1))]);
 const current=new Map(r.map(x=>[x.id,x]));
 const initial=new Map(prev.map(x=>[x.id,x]));
 const ids=new Set([...current.keys(),...initial.keys()]);
 const projects=[...ids].map(id=>{
   const name=(current.get(id)||initial.get(id)).name;
   const a=totals(r.filter(x=>x.id===id)),b=totals(prev.filter(x=>x.id===id));
   return {name,id,op:a.op-b.op,cells:[fmt(b.op),fmt(a.op),fmt(a.sales-b.sales),fmt(a.cost-b.cost),fmt(a.sg-b.sg),fmt(a.op-b.op)]};
 }).sort((a,b)=>Math.abs(b.op)-Math.abs(a.op));
 const detail=projects.map(x=>[current.has(x.id)?act('edit',esc(x.name),x.id):esc(x.name),...x.cells]);
 const monthChange=months.map(m=>[m,report(prev.filter(r=>r.m===m)),report(r.filter(r=>r.m===m))]).filter(([m])=>period==='all'||period==='m'+m||period===String(Math.floor(m/3)));
 const monthly=monthChange.map(([m,b,a])=>[(m+1)+'월',fmt(b.op),fmt(a.op),fmt(a.op-b.op)]);
 return panel('선택 계획과 기준계획 비교','<div class="filters"><label>비교 기준 '+select('compare',choices.map(v=>[v.id,v.name]),base.id)+'</label></div>'+table(['계정','기준','선택 계획','금액 증감','영업이익 영향'],deltas))+
 panel('프로젝트별 차이 · 영향 큰 순서',table(['프로젝트','기준 영업이익','계획 영업이익','매출 Δ','원가 Δ','판관비 Δ','영업이익 Δ'],detail))+
 panel('월별 영업이익 이동',table(['월','기준','선택 계획','차이'],monthly));
}
function workbookAction(action,arg){
 if(action==='template'){templateCsv();return true}
 if(action==='month-edit'){showMonthEditor(arg);return true}
 if(action==='review'){startReview(arg);return true}
 if(action==='approved-baseline'){edit('approved-baseline');return true}
 if(action==='discard-upload'){preview=null;uploadSequence++;render();return true}
 if(action==='apply-upload'){
   if(viewVersion==='live'&&preview?.source===db.plan&&!preview.errors.length&&preview.updates.length){
     const next={...clone(db),plan:candidateFor(preview)};
     const updates=preview.updates.map(({id,m,next})=>({id,m,values:next,old:monthlyEntry(db.plan.projects.find(p=>p.id===id),m),reason:preview.filename||''}));
     inputChanges(next,updates,'CSV');
     commitWorkbook(next,'월별 계획을 반영했습니다.');
   }
   return true;
 }
 if(action==='clear-month'){
   const next=clone(db),item=next.plan.projects.find(x=>x.id===draft.id);
   if(viewVersion==='live'&&draft.kind==='month'&&item?.monthly?.[draft.m]&&canEdit(next.plan,item.firm)){
     const old=monthlyEntry(item,draft.m);
     delete item.monthly[draft.m];
     inputChanges(next,[{id:item.id,m:draft.m,old,values:monthlyEntry(item,draft.m)}],'산출값 복원');
     if(commitWorkbook(next,'공정률 산출로 복원했습니다.'))$('editor').close();
   }
   return true;
 }
 return false;
}
function submitWorkbook(draft,form){
 if(!['month','review'].includes(draft.kind))return false;
 const next=clone(db),p=next.plan;
 if(draft.kind==='month'){
   const project=p.projects.find(x=>x.id===draft.id);
   if(viewVersion!=='live'||!project||!canEdit(p,project.firm))return true;
   const old=monthlyEntry(project,draft.m);
   const values=entryKeys.map(k=>Number(form.get(k)));
   (project.monthly??={})[draft.m]=values;
   inputChanges(next,[{id:project.id,m:draft.m,old,values,reason:form.get('reason')?.trim()}],'직접 입력');
 }else{
   const {state,index}=draft,current=reviewState(p,index).state,note=form.get('note').trim();
   const allowed={submitted:['draft','returned'],approved:['submitted'],returned:['submitted','approved']};
   if(!allowed[state].includes(current))return true;
   if((state==='returned'&&!note)||(state==='submitted'&&reviewIssues(p,index).length)){
     $('err').textContent='제출 조건을 확인하거나 반려 사유를 입력하세요.';return true;
   }
   const date=new Date().toISOString();
   (p.review??={})[index]={state,note,date};
   (next.events??=[]).unshift({state,firm:index,note,date});
 }
 if(commitWorkbook(next,'변경사항을 저장했습니다.'))$('editor').close();
 return true;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab],[data-act]');if(!b)return;$('notice').textContent='';
 if(b.hasAttribute('data-tab')){tab=Number(b.dataset.tab);render();return}const a=b.dataset.act,k=b.dataset.arg;
 if(workbookAction(a,k))return;
 if(['edit','new','settings','snapshot','alternative'].includes(a))edit(a,k);else if(a==='csv')exportCsv();else{if(a==='goto')tab=+k;if(a==='view'){viewVersion=k;tab=0;firm=seg=period='all'}if(a==='reset'){for(const key of Object.keys(scenario))scenario[key]=key==='firm'?'all':0}render()}});
</script>

-align:right;padding:10px 7px;border-bottom:1px solid #e3eaee}th{color:#627684;background:#f7f9fa}td:first-child,th:first-child{text-align:left}tfoot{font-weight:bold}.bar{height:12px;border-radius:4px;background:#f0f3f5;overflow:hidden;margin:4px 0 10px}.bar i{height:100%;display:block;background:#167e78}.bar.actual i{background:#aac5c4}.legend{font-size:12px;color:#516975}.legend b{color:#147d77}details{margin:12px 0;color:#425867}summary{cursor:pointer;font-weight:bold;color:#253d4b}details p{margin:8px 0}a{color:#087366}.rate{font-size:12px}.positive{color:#167767}.negative{color:#ac553d}hr{border:0;border-top:1px solid #dfe7ea;margin:18px 0}@media(max-width:830px){.grid{grid-template-columns:1fr}.intro{align-items:start;flex-direction:column}.kpis{gap:6px}.card{padding:10px}.card small{font-size:11px}main{padding:18px 12px}.card strong{font-size:21px}.row{flex-wrap:wrap}}\n\u003c/style>\n\u003cheader>\u003cdiv class=\"logo\">\u003cspan class=\"mark\">◒\u003c/span>사업계획 스튜디오\u003c/div>\u003csmall>한화오션 · 042660\u003c/small>\u003c/header>\n\u003cmain>\u003cdiv class=\"intro\">\u003cdiv>\u003csmall>2025 연결 실적 → 2026 가상 계획\u003c/small>\u003ch1>한화오션 사업계획 시뮬레이터\u003c/h1>\u003cp class=\"sub\">사업별 매출 가정이 연결 영업이익에 미치는 영향을 비교하세요.\u003c/p>\u003c/div>\u003cbutton id=\"csv\">계획 CSV 받기 ↓\u003c/button>\u003c/div>\n\u003cdiv class=\"kpis\" id=\"kpis\">\u003c/div>\u003cdiv class=\"grid\">\u003carticle>\u003ch2>계획 가정\u003c/h2>\u003cdiv class=\"actions\" id=\"presets\">\u003c/div>\u003csmall id=\"status\" role=\"status\">\u003c/small>\u003chr>\u003ch2>사업별 매출 성장률\u003c/h2>\u003cdiv id=\"sliders\">\u003c/div>\u003chr>\u003ch2>비용 가정\u003c/h2>\u003cdiv id=\"costs\">\u003c/div>\u003clabel>판관비 배부 기준 \u003cselect id=\"basis\">\u003coption value=\"sales\">매출 비례\u003c/option>\u003coption value=\"equal\">부문 균등\u003c/option>\u003c/select>\u003c/label>\u003c/article>\n\u003cdiv class=\"side\">\u003carticle>\u003cdiv class=\"row\">\u003ch2>사업별 매출 비교\u003c/h2>\u003cspan class=\"legend\">■ 2025 실적　\u003cb>■ 2026 계획\u003c/b>\u003c/span>\u003c/div>\u003cp class=\"rate sub\">사업을 끌어 놓거나 화살표로 비교 순서를 바꾸세요.\u003c/p>\u003cdiv id=\"chart\">\u003c/div>\u003c/article>\n\u003carticle>\u003ch2>연결 손익계산서\u003c/h2>\u003cdiv class=\"scroll\" id=\"pnl\">\u003c/div>\u003c/article>\n\u003carticle>\u003ch2>사업별 배부 후 손익\u003c/h2>\u003csmall>공통 원가율 및 판관비 배부 가정 적용 · 억 원\u003c/small>\u003cdiv class=\"scroll\" id=\"segments\">\u003c/div>\u003c/article>\u003c/div>\u003c/div>\n\u003cdetails>\u003csummary>공시 출처와 계산 기준\u003c/summary>\u003cp>기준 기간은 2025년 1월~12월입니다. 2026년 값과 시나리오 버튼의 변동률은 사용자가 수정하는 예시 가정입니다.\u003c/p>\u003cp>사업별 매출은 사업보고서 ‘Ⅱ. 사업의 내용 → 4. 매출 및 수주상황’의 백만원 수치를 사용합니다. 상선과 해양·특수선은 수출과 내수를 합산했습니다. 연결조정은 2025년 금액을 고정합니다. 부문 표 합계와 원 단위 연결 손익계산서의 반올림 차이는 연결조정에 포함합니다.\u003c/p>\u003cp>계획 매출 = 기준 매출 × (1 + 부문별 성장률). 계획 매출원가는 모든 부문과 연결조정에 같은 연결 원가율을 적용합니다. 계획 판관비는 2025년 판관비에 변동률을 적용하고 영업 부문에 배부합니다. 개별 사업의 이익은 이 가정에서 계산한 관리 추정치입니다.\u003c/p>\u003cp>\u003ca href=\"https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260317000644\" target=\"_blank\" rel=\"noopener\">DART · 제26기 정정 사업보고서\u003c/a>　\u003ca href=\"https://kind.krx.co.kr/external/2026/03/04/001601/20260304003622/00660.htm\" target=\"_blank\" rel=\"noopener\">KRX · 연결 손익계산서\u003c/a>\u003c/p>\u003c/details>\u003c/main>\n\u003cscript>\nconst actual={sales:12783512278323,cost:10943214281345,overhead:672707859050};\nconst segments=[['상선',10523365],['해양 및 특수선',2030907],['E&I',819373],['기타',140694]].map(([name,millions])=>({name,sales:millions*1e6}));\nconst adjustment=actual.sales-segments.reduce((total,item)=>total+item.sales,0);\nconst presets={'실적 유지':[0,0,0,0,0,0],'성장 예시':[8,12,6,0,-0.5,3],'하방 예시':[-8,-4,-5,0,1.5,2]};\nconst keys=['s0','s1','s2','s3','cost','overhead'];\nconst labels=[...segments.map(s=>s.name),'매출원가율 변화','판관비 증감률'];\nconst $=id=>document.getElementById(id);\nconst units=value=>Math.round(value/1e8).toLocaleString('ko-KR');\nconst pct=value=>value.toFixed(2)+'%';\nconst profit=actual.sales-actual.cost-actual.overhead;\nfunction model(values,basis){\n  const costRate=actual.cost/actual.sales+values[4]/100;\n  const overhead=actual.overhead*(1+values[5]/100);\n  const planned=segments.map((s,i)=>s.sales*(1+values[i]/100));\n  const gross=planned.reduce((sum,n)=>sum+n,0);\n  const sales=gross+adjustment;\n  const rows=planned.map((revenue,i)=>{\n    const allocated=overhead*(basis==='equal'?1/planned.length:revenue/gross);\n    return [segments[i].name,revenue,allocated,revenue*(1-costRate)-allocated];\n  });\n  rows.push(['연결조정',adjustment,0,adjustment*(1-costRate)]);\n  return {sales,cost:sales*costRate,overhead,profit:sales*(1-costRate)-overhead,rows};\n}\nconst inputs=keys.map((key,i)=>{\n  const label=document.createElement('label');label.className='range';\n  const unit=i===4?'%p':'%';\n  label.innerHTML=labels[i]+'\u003coutput id=\"out-'+key+'\">\u003c/output>\u003cinput type=\"range\" aria-label=\"'+labels[i]+'\" min=\"'+(i===4?-5:-30)+'\" max=\"'+(i===4?5:30)+'\" step=\"'+(i===4?.1:1)+'\" value=\"0\">';\n  $(i\u003c4?'sliders':'costs').append(label);\n  const input=label.querySelector('input');input.oninput=()=>render('사용자 가정');return input;\n});\nfunction table(headers,rows,foot=[]){\n  const tr=row=>'\u003ctr>'+row.map(cell=>'\u003ctd>'+cell+'\u003c/td>').join('')+'\u003c/tr>';\n  return '\u003ctable>\u003cthead>\u003ctr>'+headers.map(h=>'\u003cth>'+h+'\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>'+rows.map(tr).join('')+'\u003c/tbody>\u003ctfoot>'+foot.map(tr).join('')+'\u003c/tfoot>\u003c/table>';\n}\nfunction values(){return inputs.map(input=>Number(input.value))}\nlet order=[0,1,2,3];\nfunction moveSegment(from,to){\n  if(from===to || !order.includes(from) || !order.includes(to)) return;\n  const target=order.indexOf(to);order.splice(order.indexOf(from),1);order.splice(target,0,from);render(currentLabel);\n}\nlet currentLabel='실적 유지';\nfunction render(label){\n  currentLabel=label;\n  const v=values(), m=model(v,$('basis').value);\n  $('status').textContent='현재 시나리오 · '+label;\n  keys.forEach((k,i)=>$('out-'+k).value=(v[i]>0?'+':'')+v[i]+(i===4?'%p':'%'));\n  $('kpis').innerHTML=[['계획 연결 매출',units(m.sales),'억 원',units(actual.sales)+'억 원'],['계획 영업이익',units(m.profit),'억 원',units(profit)+'억 원'],['계획 영업이익률',pct(100*m.profit/m.sales),'',pct(100*profit/actual.sales)]].map(([name,value,unit,base])=>'\u003cdiv class=\"card\">\u003cdiv>'+name+'\u003c/div>\u003cstrong>'+value+' \u003cspan>'+unit+'\u003c/span>\u003c/strong>\u003csmall>2025 실적 '+base+'\u003c/small>\u003c/div>').join('');\n  const maximum=Math.max(...segments.map(s=>s.sales),...m.rows.map(r=>r[1]));\n  $('chart').innerHTML=order.map((i,pos)=>{\n    const s=segments[i];\n    return '\u003cdiv draggable=\"true\" data-segment=\"'+i+'\">\u003cdiv class=\"row\">\u003cb>⠿ '+s.name+'\u003c/b>\u003csmall>'+units(s.sales)+' → '+units(m.rows[i][1])+'억 원 \u003cbutton aria-label=\"'+s.name+' 위로\" data-step=\"-1\" '+(pos===0?'disabled':'')+'>↑\u003c/button> \u003cbutton aria-label=\"'+s.name+' 아래로\" data-step=\"1\" '+(pos===3?'disabled':'')+'>↓\u003c/button>\u003c/small>\u003c/div>\u003cdiv class=\"bar actual\">\u003ci style=\"width:'+s.sales/maximum*100+'%\">\u003c/i>\u003c/div>\u003cdiv class=\"bar\">\u003ci style=\"width:'+m.rows[i][1]/maximum*100+'%\">\u003c/i>\u003c/div>\u003c/div>';\n  }).join('');\n  for(const row of $('chart').children){\n    const id=Number(row.dataset.segment);\n    row.ondragstart=e=>e.dataTransfer.setData('application/x-segment',String(id));\n    row.ondragover=e=>e.preventDefault();\n    row.ondrop=e=>{e.preventDefault();const key=e.dataTransfer.getData('application/x-segment');if(key)moveSegment(Number(key),id)};\n    row.querySelectorAll('button').forEach(b=>b.onclick=()=>moveSegment(id,order[order.indexOf(id)+Number(b.dataset.step)]));\n  }\n  const accounts=[['매출액',actual.sales,m.sales],['매출원가',actual.cost,m.cost],['매출총이익',actual.sales-actual.cost,m.sales-m.cost],['판매비와관리비',actual.overhead,m.overhead],['영업이익',profit,m.profit]];\n  $('pnl').innerHTML=table(['억 원','2025 실적','2026 계획','증감'],accounts.map(([name,a,b])=>[name,units(a),units(b),units(b-a)]));\n  $('segments').innerHTML=table(['부문','계획 매출','판관비','계획 영업이익'],m.rows.map(([n,...nums])=>[n,...nums.map(units)]),[['연결 합계',units(m.sales),units(m.overhead),units(m.profit)]]);\n}\nObject.entries(presets).forEach(([name,v])=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{inputs.forEach((input,i)=>input.value=v[i]);render(name)};$('presets').append(b)});\n$('basis').onchange=()=>render('사용자 가정');\n$('csv').onclick=()=>{\n  const v=values(),m=model(v,$('basis').value);\n  const lines=[['한화오션 2026 가상 사업계획','단위 원'],['부문','2025 매출','성장률(%)','계획 매출','배부 판관비','계획 영업이익'],...m.rows.map(([name,...nums],i)=>[name,segments[i]?.sales??adjustment,v[i]&&i\u003c4?v[i]:0,...nums.map(Math.round)]),['합계',actual.sales,'',Math.round(m.sales),Math.round(m.overhead),Math.round(m.profit)],['원가율 변화(%p)',v[4]],['판관비 변화(%)',v[5]],['배부 기준',$('basis').selectedOptions[0].textContent]];\n  const url=URL.createObjectURL(new Blob(['\\ufeff'+lines.map(row=>row.join(',')).join('\\r\\n')],{type:'text/csv;charset=utf-8'}));\n  const link=document.createElement('a');link.href=url;link.download='한화오션_2026_가상계획.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);\n};render('실적 유지');\n\u003c/script>\u003c/html>\n"</script><script>render();$("notice").textContent=loadError;</script></body></html>
