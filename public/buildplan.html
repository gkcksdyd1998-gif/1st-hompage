function composition(r,total){let pos=0;const sums=types.map((_,i)=>sum(r.filter(x=>x.type===i),'rev')),grad=sums.map((v,i)=>{const start=pos;pos+=total?v/total*100:0;return colors[i]+' '+start+'% '+pos+'%'});return '<article class="panel"><div class="panelhead"><div><h2>공종별 매출 구성</h2><p>추정 매출 기준</p></div></div><div class="ring" style="background:'+(total?'conic-gradient('+grad+')':'#eee')+'"><div><small>전체 매출</small><b>'+fmt(total)+'<small> 억</small></b></div></div><div class="ringlist">'+sums.map((v,i)=>'<div><span>'+dot(colors[i])+types[i]+'</span><strong>'+fmt(v)+'억</strong><b>'+fmt(total?v/total*100:0)+'%</b></div>').join('')+'</div></article>'}
function table(r,title,cols,action=''){return '<article class="panel tablepanel"><div class="panelhead"><div><h2>'+title+'</h2><p>전체 '+r.length+'개 공사 · 단위 억 원</p></div>'+action+'</div><div class="scroll"><table><thead><tr><th>공사명</th><th>공종</th>'+cols.map(c=>'<th>'+metrics[c]+'</th>').join('')+'</tr></thead><tbody>'+r.map(p=>'<tr tabindex="0" data-project="'+p.id+'"><td>'+esc(p.name)+'</td><td><span class="badge" style="color:'+['#465db5','#218d7d','#5879a9','#a3752c'][p.type]+';background:'+colors[p.type]+'18">'+types[p.type]+'</span></td>'+cols.map(c=>'<td style="'+(c==='profit'?'font-weight:650;color:#4258bf':'')+'">'+fmt(p[c])+(c==='margin'?'%':'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></article>'}
function analysis(r){const chip=(k,sel)=>'<button draggable="true" data-key="'+k+'" class="chip '+(sel?'picked':'')+'">'+(sel?'× ':'⠿ ')+metrics[k]+'</button>';return '<article class="panel"><h2>분석 지표</h2><p class="muted">지표를 아래 영역으로 드래그하거나 클릭하세요. 선택한 지표를 클릭하면 제거됩니다.</p><div>'+Object.keys(metrics).filter(k=>!selected.includes(k)).map(k=>chip(k,false)).join('')+'</div><div class="drop">'+(selected.map(k=>chip(k,true)).join('')||'이곳에 지표를 놓으세요')+'</div></article><br>'+table(r,'공사별 분석 결과',selected)}
function bindDrop(){document.querySelectorAll('.chip').forEach(el=>{const k=el.dataset.key;el.onclick=()=>{selected=selected.includes(k)?selected.filter(i=>i!==k):[...selected,k];render()};el.ondragstart=e=>e.dataTransfer.setData('text/plain',k)});$('.drop').ondragover=e=>e.preventDefault();$('.drop').ondrop=e=>{e.preventDefault();const k=e.dataTransfer.getData('text/plain');if(Object.hasOwn(metrics,k)){selected=selected.filter(i=>i!==k);const target=e.target.closest('.chip');const i=target?selected.indexOf(target.dataset.key):-1;selected.splice(i<0?selected.length:i,0,k);render()}}}
const bases={rev:'추정 매출 비례',cost:'직접원가 비례',equal:'공사별 균등'};
function rules(r){return '<article class="panel"><div class="panelhead"><div><h2>공통비 배부</h2><p>배부 기준을 변경하면 모든 공사의 손익에 반영됩니다.</p></div>'+button('editrule','규칙 수정')+'</div><div class="toolbar"><strong>'+bases[state().basis]+'</strong><span>연간 공통비 <b>'+fmt(state().pool)+'억 원</b></span></div></article><br>'+table(r,'공사별 배부 결과',['rev','cost','alloc','profit'])}
function field(label,name,val,type='number'){return '<label>'+label+'<input required name="'+name+'" type="'+type+'" '+(type==='number'?'min="0" max="99999999" step="0.01"':'maxlength="60"')+' value="'+esc(val)+'"></label>'}
function edit(id){const p=state().projects.find(p=>p.id===id)||{id:0,name:'',type:0,rev:0,cost:0,plan:0};editing=id;$('#formbody').innerHTML='<h2>'+(id?'공사 정보 수정':'공사 추가')+'</h2><p class="muted">'+year+' 회계연도 · 단위 억 원</p><div class="formgrid">'+field('공사명','name',p.name,'text')+'<label>공종<select name="type">'+types.map((v,i)=>'<option value="'+i+'" '+(p.type===i?'selected':'')+'>'+v+'</option>').join('')+'</select></label>'+['rev','cost','plan'].map(k=>field(metrics[k],k,p[k])).join('')+'</div>';$('#dialog').showModal()}
function editRule(){editing='rule';$('#formbody').innerHTML='<h2>배부 규칙 수정</h2><div class="formgrid">'+field('공통비 총액 (억 원)','pool',state().pool)+'<label>배부 기준<select name="basis">'+Object.entries(bases).map(([k,v])=>'<option value="'+k+'" '+(k===state().basis?'selected':'')+'>'+v+'</option>').join('')+'</select></label></div>';$('#dialog').showModal()}
$('#dialog form').onsubmit=e=>{if(e.submitter.value!=='save')return;const d=new FormData(e.target),s=state();if(editing==='scenario'){book[year]=scenarioState();changes={rev:0,cost:0,pool:0}}else if(editing==='rule'){s.pool=+d.get('pool');s.basis=d.get('basis')}else{const name=d.get('name').trim();if(!name){e.preventDefault();e.target.elements.name.focus();return}const p={id:editing||Date.now(),name,type:+d.get('type'),rev:+d.get('rev'),cost:+d.get('cost'),plan:+d.get('plan')};if(editing)s.projects[s.projects.findIndex(x=>x.id===editing)]=p;else s.projects.push(p)}saveBook();render();toast('변경사항을 반영했습니다.')};
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2100)}
function download(){const cols=page===1?selected:Object.keys(metrics),cells=[['공사명','공종',...cols.map(k=>metrics[k])],...rows().map(p=>[p.name,types[p.type],...cols.map(k=>+p[k].toFixed(2))])];const csv=cells.map(row=>row.map(x=>'"'+String(typeof x==='string'&&/^[=+@-]/.test(x)?"'"+x:x).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download=year+'_'+names[page]+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function saveBook() {
  try { localStorage.setItem(key, JSON.stringify(book)); }
  catch { toast('이 화면에 반영했습니다. 브라우저 저장을 사용할 수 없습니다.'); }
}
function workflow() {
  return '<div class="workflow"><div><span class="badge">예시 데이터 · POC</span><h2>공사 정보부터 경영계획까지</h2><p class="muted">입력한 매출과 원가에 배부 규칙을 적용해 손익을 계산합니다.</p></div><div class="flowsteps">'+[[4,'기준정보 입력'],[3,'공통비 배부'],[2,'경영계획 비교'],[5,'시나리오 검토']].map(([i,n])=>'<button onclick="go('+i+')">'+ic(icons[i])+n+' '+ic('arrow')+'</button>').join('')+'</div></div>';
}
let changes={rev:0,cost:0,pool:0};
function scenarioState() {
  const current=state(), scale=(value,rate)=>Math.round(value*(1+rate/100)*100)/100;
  return {...current,pool:scale(current.pool,changes.pool),projects:current.projects.map(p=>({...p,rev:scale(p.rev,changes.rev),cost:scale(p.cost,changes.cost)}))};
}
function scenario() {
  return '<div class="scenario-layout"><article class="panel"><h2>변동 가정</h2><p class="muted">현재 추정치를 기준으로 변동률을 적용합니다.</p>'+[['rev','매출 변동률'],['cost','직접원가 변동률'],['pool','공통비 변동률']].map(([k,n])=>'<label class="sliderlabel">'+n+'<output id="out-'+k+'">'+changes[k]+'%</output><input aria-label="'+n+'" data-rate="'+k+'" type="range" min="-30" max="30" step="1" value="'+changes[k]+'"><span class="muted">−30% <span style="float:right">+30%</span></span></label>').join('')+'<div class="toolbar"><button id="scenario-reset">가정 초기화</button><button id="scenario-apply" class="primary">추정치에 반영</button></div><p class="muted">반영하면 선택한 회계연도의 매출·원가·공통비가 갱신됩니다.</p></article><section id="scenario-result"></section></div>';
}
function scenarioResult() {
  const before=rows(),after=rows(scenarioState()),profit=sum(after,'profit'),delta=profit-sum(before,'profit'),rev=sum(after,'rev');
  $('#scenario-result').innerHTML='<article class="panel scenario-summary"><div><p class="muted">변경 후 영업이익</p><div class="value">'+fmt(profit)+'<small>억 원</small></div></div><div><p class="muted">현재 추정 대비</p><strong style="color:'+(delta<0?'#c65b54':'#16876d')+'">'+(delta>0?'+':'')+fmt(delta)+'억 원</strong><p class="muted">이익률 '+fmt(rev?profit/rev*100:0)+'%</p></div></article><br>'+table(after,'시나리오 예상 손익',['rev','alloc','profit','margin']);
  document.querySelectorAll('#scenario-result [data-project]').forEach(el=>{el.removeAttribute('tabindex');el.removeAttribute('data-project');});
}
function bindScenario() {
  scenarioResult();
  document.querySelectorAll('[data-rate]').forEach(input=>input.oninput=()=>{
    changes[input.dataset.rate]=+input.value;
    $('#out-'+input.dataset.rate).textContent=input.value+'%';
    scenarioResult();
  });
  $('#scenario-reset').onclick=()=>{changes={rev:0,cost:0,pool:0};render();};
  $('#scenario-apply').onclick=()=>{
    editing='scenario';
    $('#formbody').innerHTML='<h2>시나리오 반영</h2><p>매출 '+changes.rev+'%, 직접원가 '+changes.cost+'%, 공통비 '+changes.pool+'% 변동을 '+year+'년 추정치에 반영합니다.</p>';
    $('#dialog').showModal();
  };
}
$('#menu').onclick=()=>document.querySelector('aside').classList.toggle('open');$('[data-i]').innerHTML=ic('home');render();
</script></body></html>
